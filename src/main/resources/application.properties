spring.application.name=ms-pagos
server.port=8086

# CONFIGURACIÓN DE CONEXIÓN RABBITMQ (LOCAL)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# CENTRALIZACIÓN DE RUTAS
rabbitmq.exchange.pagos.fanout=pagos.fanout.exchange
rabbitmq.exchange.pagos.direct=pagos.direct.exchange
rabbitmq.exchange.dlx=pagos.dlx

rabbitmq.queue.email.notificacion=email.notif.queue
rabbitmq.queue.procesar.pdf=procesar.pdf.queue
rabbitmq.queue.procesar.pdf.dlq=procesar.pdf.dlq
rabbitmq.queue.email.confirmacion=email.confirmacion.queue
rabbitmq.queue.email.confirmacion.dlq=email.confirmacion.dlq

rabbitmq.routing.pdf=pdf.routing.key
rabbitmq.routing.confirmacion=confirmacion.routing.key